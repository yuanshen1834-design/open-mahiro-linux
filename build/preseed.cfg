#### open mahiro Linux —— 安装应答（半自动：常规项自动，账户与分区由用户决定）
#### 语言与键盘
d-i debian-installer/locale string zh_CN.UTF-8
d-i debian-installer/language string zh_CN
d-i debian-installer/country string CN
d-i keyboard-configuration/xkb-keymap select us
d-i keymap select us

#### 网络与主机名
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string open-mahiro
d-i netcfg/get_domain string local
d-i netcfg/wireless_wep string

#### 软件源（清华镜像）
d-i mirror/country string manual
d-i mirror/http/hostname string mirrors.tuna.tsinghua.edu.cn
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string
d-i mirror/suite string trixie
d-i mirror/codename string trixie

#### 时钟
d-i clock-setup/utc boolean true
d-i time/zone string Asia/Shanghai
d-i clock-setup/ntp boolean true

#### 分区：故意不预置
#### 安装时会进入分区界面，用户可自行选择：
####   · 向导 - 使用整个磁盘（单系统）
####   · 向导 - 使用最大的连续空闲空间（与 Windows 共存，双系统）
####   · 手动分区（高级用户）
#### 这样不会强制清空磁盘，也不会替用户做分区决定。

#### 账户：故意不预置
#### 安装时会要求用户填写：
####   · root 密码
####   · 普通用户全名、用户名、密码
#### 因此每个用户都可以用自己的账号，而不是固定的 mahiro/mahiro。

#### 桌面与软件
d-i tasksel/first multiselect xfce-desktop, standard
d-i pkgsel/include string fonts-noto-cjk fonts-noto-cjk-extra fonts-wqy-zenhei fonts-wqy-microhei fcitx5 fcitx5-chinese-addons fcitx5-frontend-gtk3 fcitx5-config-qt im-config firefox-esr firefox-esr-l10n-zh-cn libreoffice libreoffice-l10n-zh-cn libreoffice-gtk3 libreoffice-help-zh-cn mythes-zh-cn hyphen-zh-cn vlc gimp file-roller evince gparted synaptic gdebi aptitude network-manager-gnome manpages-zh wine wine64 winetricks wine-binfmt zenity curl wget firmware-linux firmware-iwlwifi firmware-realtek firmware-amd-graphics firmware-misc-nonfree
d-i pkgsel/upgrade select full-upgrade
d-i pkgsel/update-policy select none
d-i pkgsel/updatedb boolean true
popularity-contest popularity-contest/participate boolean false

#### 引导：允许探测并保留其它操作系统（Windows 双系统）
d-i grub-installer/only_debian boolean false
d-i grub-installer/with_other_os boolean true
d-i grub-installer/bootdev string default

#### 收尾
d-i finish-install/reboot_in_progress note
d-i cdrom-detect/eject boolean false

#### 品牌化与兼容层（在目标系统内执行）
d-i preseed/late_command string mkdir -p /target/opt/open-mahiro; cp -r /cdrom/open-mahiro/. /target/opt/open-mahiro/; chmod +x /target/opt/open-mahiro/setup.sh; in-target /bin/bash /opt/open-mahiro/setup.sh; rm -rf /target/opt/open-mahiro
